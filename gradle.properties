# ⚠️ jvmargs et priority sont les mêmes dans tous les jeux du poste, avec la
# version du wrapper et le JDK du daemon (gradle/gradle-daemon-jvm.properties) :
# Gradle ne réutilise un daemon d'un projet à l'autre que si les quatre sont
# identiques. Un réglage différent relance un daemon de 4 Go par projet et la
# RAM sature. Ne les change jamais dans un seul projet.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.priority=low
org.gradle.configuration-cache=true
kotlin.code.style=official
